<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog page - Devu's Blog</title>
    <style>
        /* Remove default spacing */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body */
body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    color: #222;
}

/* Header */
header {
    background-color: #222;
    padding: 20px 0;
}

/* Navigation */
nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 40px;
}

/* Navigation links */
nav ul li a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    padding: 10px 15px;
    transition: 0.3s;
}

/* Hover effect */
nav ul li a:hover {
    background-color: #ff4444;
    border-radius: 5px;
}

/* Main section */
main {
    text-align: center;
    padding: 50px;
}

/* ABES logo */
main img {
    width: 200px;
    height: 100px;
    object-fit: contain;
    border: 2px solid #ddd;
    border-radius: 10px;
    padding: 10px;
    background-color: white;
    transition: 0.3s;
}

/* Logo hover effect */
main img:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}

/* Footer */
footer {
    background-color: #222;
    color: white;
    height: 80px;
    margin-top: 50px;
}
    </style>
</head>

    </MAIN>

</body>
</html>
